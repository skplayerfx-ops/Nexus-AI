kind = "web"
previewPath = "/"
title = "Nexus-AI"
description = "A focused AI workspace with a responsive chat interface, conversation history, prompt composer, and FastAPI backend for serving AI interactions."
version = "1.0.0"
id = "artifacts/nexus-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22706

[services.development]
run = "pnpm --filter @workspace/nexus-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexus-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22706"
BASE_PATH = "/"
